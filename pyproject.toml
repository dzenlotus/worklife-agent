[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worklife-agent"
version = "0.5.2"
description = "MCP server for AI job search, resume matching, application tracking, and shared employer knowledge"
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "ai-agent",
    "job-search",
    "career-assistant",
    "recruitment",
    "resume",
    "cv",
    "application-tracking",
    "salary-analysis",
    "employer-research",
    "local-first",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cryptography>=44",
    "httpx>=0.28,<1",
    "json-five>=1.1.2,<2",
    "keyring>=25,<26",
    "mcp>=1.20,<2",
    "pypdf>=6,<7",
    "python-dotenv>=1.1,<2",
    "ruamel.yaml>=0.18,<1",
    "starlette>=0.40,<1",
    "tomlkit>=0.13,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
telegram = ["telethon>=1.45,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9"]

[project.scripts]
worklife-agent = "worklife.setup_cli:main"
worklife = "worklife.cli:main"
worklife-recruiter = "worklife.recruiter_cli:main"

[project.urls]
Homepage = "https://dzenlotus.github.io/worklife-agent/"
Repository = "https://github.com/dzenlotus/worklife-agent"
Documentation = "https://github.com/dzenlotus/worklife-agent#readme"
Issues = "https://github.com/dzenlotus/worklife-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/worklife"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
