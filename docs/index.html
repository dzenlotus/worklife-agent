        <h1>Worklife — AI job search MCP server</h1>
        <p>A local-first MCP server for AI job search, resume and CV matching, application tracking, email, and shared employer knowledge. Connect your own AI agent.</p>
        <p lang="ru">Локальный MCP-сервер для поиска работы: вакансии, подбор и подготовка CV, отклики, переписка и общие знания о работодателях. Подключите своего ИИ-агента.</p>
        <p>Requires Python 3.12+ and uv. Install for Codex:</p>
        <pre><code>uvx --python 3.12 worklife-agent --target codex</code></pre>
        <p>Also supports Claude Code, Cursor, OpenCode, and generic MCP configuration. Enable JavaScript for the interactive site and client selector.</p>
        <p><a href="https://github.com/dzenlotus/worklife-agent">Source and documentation on GitHub</a> · <a href="https://pypi.org/project/worklife-agent/">Python package on PyPI</a> · <a href="https://github.com/dzenlotus/worklife-agent/blob/main/docs/recruiter-agent.md">Client setup guide</a></p>
