x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  node:
    image: worklife-public-testnet:${WORKLIFE_REVISION:?Set the reviewed Git commit in .env}
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      WORKLIFE_HOME: /data
      WORKLIFE_CONFIG: /etc/worklife/config.toml
      WORKLIFE_CHAIN_PROFILE: public-testnet-v1
    command: [serve, --host, 0.0.0.0, --port, "8765"]
    volumes:
      - node-data:/data
      - ./config.toml:/etc/worklife/config.toml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; s = json.load(urllib.request.urlopen('http://127.0.0.1:8765/v2/state', timeout=5)); assert s['transport_protocol'] == 2 and s['profile'] == 'public-testnet-v1' and s['rules']['block_bits'] == 25 and s['rules']['qualification_bits'] == 18 and s['rules']['confirmations'] == 6"
      interval: 15s
      timeout: 10s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    logging: *bounded-logs

  worker:
    image: worklife-public-testnet:${WORKLIFE_REVISION:?Set the reviewed Git commit in .env}
    environment:
      WORKLIFE_HOME: /data
      WORKLIFE_CONFIG: /etc/worklife/config.toml
      WORKLIFE_CHAIN_PROFILE: public-testnet-v1
    command:
      - chain
      - worker
      - --cpu-fraction
      - "${WORKER_CPU_FRACTION:-0.25}"
      - --batch-attempts
      - "${WORKER_BATCH_ATTEMPTS:-250000}"
      - --sync-seconds
      - "${WORKER_SYNC_SECONDS:-30}"
    volumes:
      - node-data:/data
      - ./config.toml:/etc/worklife/config.toml:ro
    depends_on:
      node:
        condition: service_healthy
    restart: unless-stopped
    logging: *bounded-logs

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    environment:
      NODE_DOMAIN: ${NODE_DOMAIN:?Set this operator's public DNS name in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      node:
        condition: service_healthy
    restart: unless-stopped
    logging: *bounded-logs

volumes:
  node-data:
  caddy-data:
  caddy-config:
